name: 'Setup dev environment'
description: 'Godot 4.7.2 (headless) + Node 20 + Python 3.12 — एजेंट रन के लिए'
runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 20

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Cache Godot
      id: cache-godot
      uses: actions/cache@v4
      with:
        path: |
          /usr/local/bin/godot
          ~/.local/share/godot
        key: godot-4.7.2-stable-linux

    - name: Install Godot 4.7.2 + export templates
      if: steps.cache-godot.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -e
        wget -q https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
        unzip -q -o Godot_v4.7.2-stable_linux.x86_64.zip
        sudo mv Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
        wget -q https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
        mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable
        unzip -q -o Godot_v4.7.2-stable_export_templates.tpz
        mv templates/* ~/.local/share/godot/export_templates/4.7.2.stable/
        rm -f Godot_v4.7.2-stable_linux.x86_64.zip Godot_v4.7.2-stable_export_templates.tpz

    - name: Import project assets (headless)
      shell: bash
      run: timeout 120 godot --headless --path game -e --quit || true