name: Deploy Merge & Bloom (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "merge-and-bloom/**"
      - ".github/workflows/web-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify the game model tests pass
        working-directory: merge-and-bloom
        run: |
          node --version
          node --check js/config.js && node --check js/model.js && node --check js/platform.js && node --check js/game.js
          node test.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: merge-and-bloom
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
